[project]
name = "edu-trainer"
version = "0.1.0"
description = "Тренажёр юного разработчика: комнаты учеников, агенты LLM, песочницы"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pyyaml>=6.0",
  "anthropic>=0.60",
  "openai>=1.40",
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "docker>=7.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "pgserver>=0.1.4",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/trainer", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "."]
addopts = "--import-mode=importlib -m 'not docker'"
markers = ["db: требует PostgreSQL (pgserver)", "docker: требует настоящий Docker (запуск на VPS: pytest -m docker)"]

[tool.ruff]
line-length = 110
target-version = "py312"
